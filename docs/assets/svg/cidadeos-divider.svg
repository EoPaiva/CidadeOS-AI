<svg width="1200" height="64" viewBox="0 0 1200 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Divisória de seção">
  <defs>
    <linearGradient id="fadeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#19A7A8" stop-opacity="0"/>
      <stop offset="18%" stop-color="#19A7A8" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#19A7A8" stop-opacity=".95"/>
      <stop offset="82%" stop-color="#19A7A8" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#19A7A8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .dash {
        fill: none;
        stroke: url(#fadeLine);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 18 10;
        animation: slide 10s linear infinite;
      }
      .core {
        animation: pulse 2.7s ease-in-out infinite;
        transform-origin: 600px 32px;
      }
      .core-ring {
        animation: ring 2.7s ease-in-out infinite;
        transform-origin: 600px 32px;
      }
      .micro {
        animation: blink 2.2s ease-in-out infinite;
      }
      .micro.b { animation-delay: .35s; }
      .micro.c { animation-delay: .7s; }
      @keyframes slide {
        to { stroke-dashoffset: -224; }
      }
      @keyframes pulse {
        0%,100% { opacity: .75; transform: scale(.94); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes ring {
        0%,100% { opacity: .20; transform: scale(.96); }
        50% { opacity: .42; transform: scale(1.08); }
      }
      @keyframes blink {
        0%,100% { opacity: .35; }
        50% { opacity: .9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dash, .core, .core-ring, .micro { animation: none; }
      }
    </style>
  </defs>

  <!-- classic dashed divider line -->
  <line class="dash" x1="36" y1="32" x2="1164" y2="32" />

  <!-- subtle center anchor -->
  <circle class="core-ring" cx="600" cy="32" r="14" fill="none" stroke="#19A7A8" stroke-width="1.6"/>
  <circle class="core" cx="600" cy="32" r="4.8" fill="#19A7A8"/>

  <!-- tiny government-style signal points -->
  <circle class="micro a" cx="560" cy="32" r="2" fill="#19A7A8"/>
  <circle class="micro b" cx="640" cy="32" r="2" fill="#19A7A8"/>
  <circle class="micro c" cx="680" cy="32" r="2" fill="#19A7A8"/>
  <circle class="micro b" cx="520" cy="32" r="2" fill="#19A7A8"/>
</svg>
